<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ATLAS Wealth Verification</title>

  <!-- Cartão de prévia. O link do demo circula por WhatsApp, e sem estas linhas
       o aplicativo mostra só o endereço cru, sem dizer o que é. Descrição
       escrita como texto comercial de propósito: é a primeira coisa que o
       prospect lê, antes de decidir se abre. -->
  <meta name="description" content="Confere as carteiras do mês antes de o relatório chegar ao cliente. Concilia patrimônio, aponta o que não fecha e mostra o custo total sobre o patrimônio." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="ATLAS — Verificação mensal de carteiras" />
  <meta property="og:description" content="Demonstração aberta, sem cadastro. 40 carteiras, conciliação de patrimônio e transparência de custo. Dados sintéticos." />
  <meta property="og:site_name" content="ATLAS" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:url" content="https://demo.multi-assets.com" />

  <!-- Cartão de prévia. Endereço absoluto do demo de propósito: og:image
       relativo não é resolvido por todo leitor de link, e o demo é a única
       superfície pública que algum robô chega a ler. Numa instância de
       cliente, que fica atrás do Access, estas linhas nunca são buscadas.
       O arquivo é desenhado por scripts/gera-card-social.py, não é captura
       de tela, e por isso não carrega dado de carteira nenhuma. -->
  <meta property="og:image" content="https://demo.multi-assets.com/atlas-card.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="ATLAS, verificação mensal de carteiras. Cada carteira fecha o mês como LIBERAR, COM ALERTA ou CORRIGIR." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://demo.multi-assets.com/atlas-card.png" />

  <link rel="stylesheet" href="platform-styles.css?v=20260808d" />

  <!-- Marca da instância (opcional, gitignored). Define window.AtlasBrand antes
       dos tokens. Sem ele o app roda neutro, sem nome de casa nenhuma. -->
  <script src="platform-brand.js?v=20260808" onerror="void(0)"></script>

  <!-- Design Tokens — JS puro, antes dos scripts JSX -->
  <script src="platform-tokens.js?v=20260808"></script>

  <!-- React 18.3.1 + Babel Standalone 7.29.0 (SRI de referência carteiras-app) -->
  <script
    src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
    crossorigin="anonymous"
  ></script>
  <script
    src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
    crossorigin="anonymous"
  ></script>
  <script
    src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
    integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
    crossorigin="anonymous"
  ></script>
</head>
<body>
  <!-- Loading estático — substituído pelo React ao montar -->
  <div id="root">
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0A1928;">
      <div style="font-family:'JetBrains Mono',monospace;font-size:0.857rem;color:#C4A228;letter-spacing:0.1em;">
        ATLAS &mdash; Carregando...
      </div>
    </div>
  </div>

  <!-- prop-types 15.8.1 — peer dep do Recharts -->
  <script
    src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"
    integrity="sha384-/AfDwVDXNopzPvhxMPQ11y1OCpR6mVkWx47qzSwIiquvxkcMkZddEzDNtIOtfCpk"
    crossorigin="anonymous"
  ></script>
  <!-- Recharts 2.12.7 — gráficos avançados (UMD, bundled deps, peer: React/ReactDOM/PropTypes acima) -->
  <script
    src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"
    integrity="sha384-d1XH4LhwLW8j0l6VXMP8yJabdGY9ZqtZk7k7PaPk5NoUCcZ/hDkL5aaKioKQbcZg"
    crossorigin="anonymous"
  ></script>

  <!-- Chart.js 4.4.0 — gráficos canvas para aba Tendência -->
  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"
    integrity="sha384-e6nUZLBkQ86NJ6TVVKAeSaK8jWa3NhkYWZFomE39AvDbQWeie9PlQqM3pmYW5d1g"
    crossorigin="anonymous"
  ></script>

  <!-- TanStack Virtual 3.0.0 — virtualização de listas grandes -->
  <script
    src="https://unpkg.com/@tanstack/react-virtual@3.0.0/build/umd/index.production.js"
    integrity="sha384-qTjAXw+7X+de+FLeQSJPVEmM/OAj7AT14TknLs9zPck8soo2LpkWIWf3x8n6bujJ"
    crossorigin="anonymous"
  ></script>

  <!-- Parser de importação (CSV/Excel) — JS puro, sem Babel -->
  <script src="platform-parsers.js?v=20260611e"></script>

  <!-- 1a. Dados reais (LGPD, gitignored — opcional; sem ele só demo ativo) -->
  <script src="platform-data-real.js?v=20260612" onerror="void(0)"></script>

  <!-- 1b. Dados (script normal — sem Babel, sem JSX) -->
  <script src="platform-data.js?v=20260808e"></script>

  <!-- 1c. Risk scoring (carregado depois de platform-data.js — usa window.AtlasData._internal) -->
  <script src="platform-data-risk.js?v=20260613a"></script>

  <!-- 1d. Dados de auditoria (LGPD, gitignored — opcionais; alimentam a aba Tendência) -->
  <script src="platform-data-audit.js?v=20260714" onerror="void(0)"></script>
  <script src="platform-historico.js?v=20260714" onerror="void(0)"></script>

  <!-- 1e. Fallback sintetico de HISTORICO_DATA quando o overlay real (1d) nao
       carregou — produto puro, versionado, nao LGPD. So popula se 1d nao populou. -->
  <script src="platform-historico-demo.js?v=20260718a"></script>

  <!-- 2. Utilitários, ícones, gráficos (Babel JSX) -->
  <script type="text/babel" src="platform-utils.jsx?v=20260718b"></script>

  <!-- 3. Páginas (carregadas na etapa correspondente) -->
  <script type="text/babel" src="platform-dashboard.jsx?v=20260808c"></script>
  <script type="text/babel" src="platform-carteira.jsx?v=20260808"></script>
  <script type="text/babel" src="platform-report.jsx?v=20260808"></script>
  <script type="text/babel" src="platform-achados.jsx?v=20260808b"></script>
  <script type="text/babel" src="platform-comparativo.jsx?v=20260808"></script>
  <script type="text/babel" src="platform-custos.jsx?v=20260808"></script>
  <script type="text/babel" src="platform-receitas.jsx?v=20260808"></script>
  <script type="text/babel" src="platform-cadastro.jsx?v=20260808"></script>
  <script type="text/babel" src="platform-busca.jsx?v=20260718a"></script>
  <script type="text/babel" src="platform-import.jsx?v=20260808"></script>
  <script type="text/babel" src="platform-usuarios.jsx?v=20260611d"></script>

  <script type="text/babel" src="platform-risco.jsx?v=20260808c"></script>
  <script type="text/babel" src="platform-tendencia.jsx?v=20260714"></script>

  <!-- 4. App shell — deve ser carregado por ÚLTIMO (monta o ReactDOM) -->
  <script type="text/babel" src="platform-app.jsx?v=20260808d"></script>
</body>
</html>
