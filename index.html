<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ATLAS Wealth Verification</title>

  <!-- Cartão de prévia. O link do demo circula por WhatsApp, e sem estas linhas
       o aplicativo mostra só o endereço cru, sem dizer o que é. Descrição
       escrita como texto comercial de propósito: é a primeira coisa que o
       prospect lê, antes de decidir se abre. -->
  <meta name="description" content="Confere as carteiras do mês antes de o relatório chegar ao cliente. Concilia patrimônio, aponta o que não fecha e mostra o custo total sobre o patrimônio." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="ATLAS — Verificação mensal de carteiras" />
  <meta property="og:description" content="Acesse o demo do ATLAS em um minuto. 40 carteiras de demonstração, conciliação de patrimônio e transparência de custo. Dados sintéticos." />
  <meta property="og:site_name" content="ATLAS" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:url" content="https://demo.multi-assets.com" />

  <!-- Cartão de prévia. Endereço absoluto do demo de propósito: og:image
       relativo não é resolvido por todo leitor de link, e o demo é a única
       superfície pública que algum robô chega a ler. Numa instância de
       cliente, que fica atrás do Access, estas linhas nunca são buscadas.
       O arquivo é desenhado por scripts/gera-card-social.py, não é captura
       de tela, e por isso não carrega dado de carteira nenhuma. -->
  <meta property="og:image" content="https://demo.multi-assets.com/atlas-card.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="ATLAS, verificação mensal de carteiras. Cada carteira fecha o mês como LIBERAR, COM ALERTA ou CORRIGIR." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://demo.multi-assets.com/atlas-card.png" />

  <link rel="stylesheet" href="platform-styles.css" />

  <!-- Marca da instância (opcional, gitignored). Define window.AtlasBrand antes
       dos tokens. Sem ele o app roda neutro, sem nome de casa nenhuma. -->
  <script src="platform-brand.js?v=20260808" onerror="void(0)"></script>

  <!-- Entrada única do bundle (Vite). A ordem de execução interna é a ordem
       de import em src/main.jsx: tokens → parsers → dados → utils → páginas
       → shell. É o contrato de carga que substitui a lista de scripts Babel. -->
  <script type="module" src="/src/main.jsx"></script>

  <!-- Overlays de dado real (LGPD, gitignored — opcionais; sem eles só demo
       ativo). São scripts clássicos e rodam ANTES do bundle (scripts module
       são diferidos), então window._AtlasRealData e window.HISTORICO_DATA já
       existem quando o app os lê. O build de produção retira estas tags; a
       instância as injeta no próprio index (scripts/gen-index.mjs). -->
  <script src="platform-data-real.js?v=20260612" onerror="void(0)"></script>
  <script src="platform-data-audit.js?v=20260714" onerror="void(0)"></script>
  <script src="platform-historico.js?v=20260714" onerror="void(0)"></script>
</head>
<body>
  <!-- Loading estático — substituído pelo React ao montar -->
  <div id="root">
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0A1928;">
      <div style="font-family:'JetBrains Mono',monospace;font-size:0.857rem;color:#C4A228;letter-spacing:0.1em;">
        ATLAS &mdash; Carregando...
      </div>
    </div>
  </div>
</body>
</html>
