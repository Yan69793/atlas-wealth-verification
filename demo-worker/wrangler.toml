# Worker do demo publico.
#
# NAO confundir com verificacao-carteiras/worker/wrangler.toml, que e a
# instancia do cliente. Aquele tem R2 com dado real, Cloudflare Access, Service
# Token e dominio proprio. Este aqui nao tem nada disso de proposito.
#
# Tem `main` desde 2026-08-30: src/index.js so checa um cookie de sessao e
# devolve a tela de senha quando falta. Continua sem Access, sem R2, sem dado
# real, o unico papel do codigo e nao deixar o link do demo aberto pra
# qualquer um que o ache. Ver o cabecalho de src/index.js para o desenho e a
# razao de nao ser o mesmo padrao removido do produto real.
#
# O diretorio public/ e montado por scripts/build-deploy.mjs, que deriva a
# lista do proprio index.html, recusa os overlays de dado real por nome e
# aborta se qualquer binario chegar na saida. Nunca apontar para a raiz do
# repo: o deploy nao respeita .gitignore, e foi assim que dado real de carteira
# acabou publicado em 15/07/2026.

name = "app-verificacao-carteiras-atlas"
main = "src/index.js"
compatibility_date = "2026-08-01"
account_id = "7ac79fb1030e4e81115ef33c21a9b070"

# Publico e sem Access, que e o ponto: o prospect abre o link e ve o sistema
# depois de digitar a senha do demo. O que protege dado nao e perimetro
# nenhum, e o fato de nao existir dado real dentro (ver acima).
workers_dev = true

# DEMO_SENHA e obrigatoria, mas nao existe trava disso no wrangler.toml: o
# wrangler nao tem bloco [secrets], secret se define por fora com
# `npx wrangler secret put DEMO_SENHA --name app-verificacao-carteiras-atlas`
# (o comando exato esta no cabecalho de src/index.js). A trava real fica no
# runtime: src/index.js devolve 500 e nao serve nada quando o secret falta.
# Sem a senha voce publica um Worker morto, nunca um aberto. Nao confiar em
# config pra recusar deploy, o wrangler ignora bloco que ele nao conhece.

[assets]
directory = "./public"
binding = "ASSETS"
# Sem isto o Worker so roda pra caminho que NAO bate com arquivo estatico, e
# "/" bate com index.html: a senha nunca seria pedida. run_worker_first forca
# todo pedido a passar pelo src/index.js primeiro.
run_worker_first = true
# Rotas do app sao hash (#/dashboard), mas o fallback de SPA garante que
# qualquer caminho servido devolva o index em vez de 404.
not_found_handling = "single-page-application"

# D1 dedicado ao cadastro proprio do demo (nome, email, senha). Banco NOVO,
# criado em 2026-09-01, proprio do demo. Nao tocar no verificacao-db (dono
# incerto, documentado no ESTADO). database_id e por CONTA: se o caminho da
# conta nova for retomado, criar banco la e trocar o id.
[[d1_databases]]
binding = "DB"
database_name = "atlas-demo-cadastros"
database_id = "0b4036d8-fc44-4ad5-802b-3545c500b3e0"

# Endereco do demo. Zona neutra de proposito: multi-assets.com nao carrega o
# nome da consultoria, o que acompanha a decisao de marca neutra do produto.
#
# NAO usar szuchmacher.com.br aqui. A instancia do cliente vive em
# atlas.szuchmacher.com.br, e um demo vizinho entregaria o endereco dela a
# quem recebesse o link. Esta protegida por Access, mas nao ha motivo para
# anunciar onde ela fica.
#
# O apice multi-assets.com e o www ja pertencem ao worker sz-sites. Este
# registro cria so o subdominio e nao encosta nos dois.
[[routes]]
pattern = "demo.multi-assets.com"
custom_domain = true
