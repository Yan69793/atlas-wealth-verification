<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verificação de Carteiras · Relatórios Mensais</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      padding: 2rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 820px;
      width: 100%;
    }
    header {
      margin-bottom: 2rem;
    }
    header h1 {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #1d1d1f;
    }
    header p {
      font-size: 0.9rem;
      color: #6e6e73;
      margin-top: 0.3rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    th, td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid #e8e8ed;
    }
    th {
      background: #f5f5f7;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #6e6e73;
    }
    td {
      font-size: 0.9rem;
    }
    td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    td a {
      color: #0071e3;
      text-decoration: none;
      font-weight: 500;
    }
    td a:hover { text-decoration: underline; }
    .status-liberar { color: #30a74e; }
    .status-alerta { color: #b86500; }
    .status-corrigir { color: #c41e3a; }
    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #8e8e93;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Relatórios Mensais</h1>
      <p>Verificação de carteiras — Mirabaud Family Office</p>
    </header>
    <table>
      <thead>
        <tr>
          <th>Mês</th>
          <th class="num">Carteiras</th>
          <th class="num">Liberar</th>
          <th class="num">Alerta</th>
          <th class="num">Corrigir</th>
        </tr>
      </thead>
      <tbody>
            <tr>
              <td><a href="2026-05/">Maio 2026</a></td>
              <td class="num">108</td>
              <td class="num status-liberar">14</td>
              <td class="num status-alerta">84</td>
              <td class="num status-corrigir">10</td>
            </tr>            <tr>
              <td><a href="2026-04/">Abril 2026</a></td>
              <td class="num">111</td>
              <td class="num status-liberar">4</td>
              <td class="num status-alerta">97</td>
              <td class="num status-corrigir">10</td>
            </tr>            <tr>
              <td><a href="2026-03/">Março 2026</a></td>
              <td class="num">114</td>
              <td class="num status-liberar">3</td>
              <td class="num status-alerta">101</td>
              <td class="num status-corrigir">10</td>
            </tr>            <tr>
              <td><a href="2026-02/">Fevereiro 2026</a></td>
              <td class="num">96</td>
              <td class="num status-liberar">6</td>
              <td class="num status-alerta">83</td>
              <td class="num status-corrigir">7</td>
            </tr>
      </tbody>
    </table>
    <footer>
      <a href="../">Abrir dashboard principal</a>
    </footer>
  </div>
</body>
</html>
